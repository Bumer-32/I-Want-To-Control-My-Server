<!doctype html>
<html lang="en">
  <head>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded"
      rel="stylesheet"
    />

    <!-- Meta -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I want to control my Server!</title>

    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon" />

    <!-- Styles -->
    <link rel="stylesheet" href="./styles/style.scss" />

    <!-- for quick load loading animation -->
    <style>
      /* a part of https://uiverse.io/alexruix/neat-tiger-82 */
      .loading {
        z-index: 50;
        background-color: #1f2626;
        position: absolute;
        top: 0;
        left: 0;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .loading .loader {
        width: 112px;
        height: 112px;
        animation: loader 2s cubic-bezier(0.84, -0.11, 0.33, 1.01) infinite;

        .box1,
        .box2,
        .box3 {
          border: 16px solid #f5f5f5;
          box-sizing: border-box;
          position: absolute;
          height: 48px;
          width: 48px;
        }

        .box1 {
          width: 112px;
          margin-top: 64px;
        }

        .box3 {
          margin-left: 64px;
        }
      }

      @keyframes loader {
        0% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(90deg);
        }
        50% {
          transform: rotate(180deg);
        }
        75% {
          transform: rotate(270deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>

    <!-- for quick load loading animation -->
    <div class="loading">
      <div class="loader">
        <span class="box1"></span>
        <span class="box2"></span>
        <span class="box3"></span>
      </div>
    </div>

    <noscript>
      <img src="./assets/icon_clearbg.png" alt="IWTCMS logo" />
      <p>
        If you see this message, enable javascript in your browser settings.
      </p>
    </noscript>
  </body>
</html>
