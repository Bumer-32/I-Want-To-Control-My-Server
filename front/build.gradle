import org.apache.tools.ant.taskdefs.condition.Os
import groovy.json.JsonSlurper
import groovy.json.JsonOutput

tasks.register("build", Exec) {
    group "build"
    dependsOn tasks.syncVersions
    dependsOn tasks.npmInstall

    workingDir projectDir

    String npm = "npm"
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        npm = "npm.cmd"
    }

    commandLine npm, "run", "build", "--", "--emptyOutDir"
}

tasks.register("npmInstall", Exec) {
    workingDir projectDir

    String npm = "npm"
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        npm = "npm.cmd"
    }

    commandLine npm, "install"
}

tasks.register("run", Exec) {
    workingDir projectDir
    dependsOn tasks.syncVersions
    dependsOn tasks.npmInstall

    String npm = "npm"
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        npm = "npm.cmd"
    }

    commandLine npm, "run", "dev"
}

tasks.register("syncVersions") {
    def file = file("package.json")
    def json = new JsonSlurper().parseText(file.text)
    json.version = version
    file.text = JsonOutput.prettyPrint(JsonOutput.toJson(json))
    println "package.json version -> ${json.version}"
}

