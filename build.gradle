import java.time.LocalDate

plugins {
	id "org.jetbrains.kotlin.jvm" version "${kotlin_version}" apply false
	id "org.jetbrains.kotlin.plugin.serialization" version "${kotlin_version}" apply false
	id "com.gradleup.shadow" version "${shadow_version}" apply false
}

allprojects {
	version = switch (version_type) {
		case "dev" -> {
			def date = LocalDate.now()
			"${date.year % 100}.$date.dayOfYear"
		}
		case "release" -> version
		case "test" -> version
        default -> throw new IllegalStateException()
    }
	group = maven_group
}

subprojects {
	repositories {
		mavenCentral()
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
	}

	plugins.withId("java") {
		base {
			archivesName = "iwtcms-$project.name"
		}

		java {
			withSourcesJar()

			sourceCompatibility = JavaVersion.VERSION_21
			targetCompatibility = JavaVersion.VERSION_21
		}
	}

	plugins.withId("maven-publish") {
		publishing {
			publications {
				mavenJava(MavenPublication) {
					from components.java
					artifactId = "iwtcms-$project.name"
				}
			}

			repositories {
				maven {
					url = uri(
						switch (version_type) {
							case "dev" -> "https://maven.lumivoid.pp.ua/unstable"
							case "release" -> "https://maven.lumivoid.pp.ua/releases"
							case "test" -> "https://maven.lumivoid.pp.ua/tests"
							default -> throw new IllegalStateException()
						}
					)

					credentials {
						username = System.getenv("MAVEN_USERNAME")
						password = System.getenv("MAVEN_SECRET")
					}
				}
			}
		}
	}
}